version: '2'

services:
    web:
        container_name: web
        image: nginx:latest
        ports:
            - "8080:80"
        volumes:
            - .:/laravel
            - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - io
    php:
        container_name: php
        image: custom-php
        volumes:
            - .:/laravel
        working_dir: /laravel
        depends_on:
            - db
            - rabbitmq
            - redis
            - elasticsearch
    queue:
        container_name: queue
        image: custom-php
        volumes:
            - .:/laravel
        working_dir: /laravel
        depends_on:
            - php
        command: bash -c 'php artisan rabbitmq:consume'
    io:
        container_name: io
        build:
            context: ./docker/io
        working_dir: "/usr/src/app"
        volumes:
            - "./io:/usr/src/app"
        depends_on:
            - redis
        ports:
            - "3000:3000"
    db:
        container_name: db
        image: mysql:latest
        volumes:
            - ./data/mysql/:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: "root"
            MYSQL_DATABASE: "laravel"
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        depends_on:
            - db
        ports:
            - "9090:80"
        environment:
            PMA_HOST: db
            PMA_ARBITRARY: 1
    redis:
        image: redis
        container_name: redis
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq
        volumes:
          - ./data/rabbitmq:/var/lib/rabbitmq
        environment:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
        container_name: elasticsearch
        environment:
          - discovery.type=single-node
          - xpack.security.enabled=false
          - http.host=0.0.0.0
          - transport.host=127.0.0.1
        volumes:
          - ./data/elasticsearch:/usr/share/elasticsearch/data