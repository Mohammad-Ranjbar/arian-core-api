version: '2'

services:
    web:
        container_name: web
        image: nginx:latest
        ports:
            - "8080:80"
        volumes:
            - .:/laravel
            - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - io
    php:
        container_name: php
        image: meysam1987/php
        volumes:
            - .:/laravel
        working_dir: /laravel
        depends_on:
            - db
            - rabbitmq
            - redis
            - elasticsearch
    queue:
        container_name: queue
        image: meysam1987/php
        volumes:
            - .:/laravel
        working_dir: /laravel
        depends_on:
            - php
        command: bash -c 'php artisan rabbitmq:consume'
    io:
        container_name: io
        build:
            context: ./docker/io
        working_dir: "/usr/src/app"
        volumes:
            - "./io:/usr/src/app"
        depends_on:
            - redis
        ports:
            - "3000:3000"
    db:
        container_name: db
        image: mysql:latest
        volumes:
            - ./data/mysql/:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: "root"
            MYSQL_DATABASE: "laravel"
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        depends_on:
            - db
        ports:
            - "9090:80"
        environment:
            PMA_HOST: db
            PMA_ARBITRARY: 1
    redis:
        image: redis
        container_name: redis
    rabbitmq:
        container_name: rabbitmq
        image: rabbitmq
        volumes:
          - ./data/rabbitmq:/var/lib/rabbitmq
        environment:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
        container_name: elasticsearch
        environment:
          - discovery.type=single-node
          - xpack.security.enabled=false
          - http.host=0.0.0.0
          - transport.host=127.0.0.1
        volumes:
          - ./data/elasticsearch:/usr/share/elasticsearch/data

    postgres:
        image: postgres
        environment:
            - POSTGRES_DB=sentry
            - POSTGRES_USER=sentry
            - POSTGRES_PASSWORD=sentry
    sentry:
        image: sentry
        container_name: sentry
        depends_on:
            - redis
            - postgres
        links:
            - redis
            - postgres
        ports:
            - "7070:9000"
        environment:
            SENTRY_SECRET_KEY: 're*@%&^7#^q5h6xv_y=e%jn--_p*^xbcir&4+#^9a7+y1lc6ls'
            SENTRY_POSTGRES_HOST: postgres
            SENTRY_DB_USER: sentry
            SENTRY_DB_PASSWORD: sentry
            SENTRY_REDIS_HOST: redis
            # SENTRY_SERVER_EMAIL: '<FROM-EMAIL>'
            # SENTRY_EMAIL_HOST: <EMAIL-HOST>
            # SENTRY_EMAIL_PORT: <EMAIL-PORT>
            # SENTRY_EMAIL_USER: '<USER-NAME>'
            # SENTRY_EMAIL_PASSWORD: '<USER-PASSWD>'
            # SENTRY_EMAIL_USE_TLS: 'true'

    sentry-cron:
            image: sentry
            depends_on:
                - redis
                - postgres
            command: "sentry run cron"
            environment:
                SENTRY_SECRET_KEY: 're*@%&^7#^q5h6xv_y=e%jn--_p*^xbcir&4+#^9a7+y1lc6ls'
                SENTRY_POSTGRES_HOST: postgres
                SENTRY_DB_USER: sentry
                SENTRY_DB_PASSWORD: sentry
                SENTRY_REDIS_HOST: redis
                # SENTRY_SERVER_EMAIL: '<FROM-EMAIL>'
                # SENTRY_EMAIL_HOST: <EMAIL-HOST>
                # SENTRY_EMAIL_PORT: <EMAIL-PORT>
                # SENTRY_EMAIL_USER: '<USER-NAME>'
                # SENTRY_EMAIL_PASSWORD: '<USER-PASSWD>'
                # SENTRY_EMAIL_USE_TLS: 'true'

    sentry-worker:
            image: sentry
            depends_on:
                - redis
                - postgres
            command: "sentry run worker"
            environment:
                SENTRY_SECRET_KEY: 're*@%&^7#^q5h6xv_y=e%jn--_p*^xbcir&4+#^9a7+y1lc6ls'
                SENTRY_POSTGRES_HOST: postgres
                SENTRY_DB_USER: sentry
                SENTRY_DB_PASSWORD: sentry
                SENTRY_REDIS_HOST: redis
                # SENTRY_SERVER_EMAIL: '<FROM-EMAIL>'
                # SENTRY_EMAIL_HOST: <EMAIL-HOST>
                # SENTRY_EMAIL_PORT: <EMAIL-PORT>
                # SENTRY_EMAIL_USER: '<USER-NAME>'
                # SENTRY_EMAIL_PASSWORD: '<USER-PASSWD>'
                # SENTRY_EMAIL_USE_TLS: 'true'